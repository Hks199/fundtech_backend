services:
  api:
    build: .
    image: fifo-inventory-backend:${IMAGE_TAG:-local}
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: production
      PORT: '3000'
      TRUST_PROXY: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  consumer:
    image: fifo-inventory-backend:${IMAGE_TAG:-local}
    env_file:
      - path: .env
        format: raw
    environment:
      NODE_ENV: production
    command: ['node', 'dist/src/consumer.js']
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
