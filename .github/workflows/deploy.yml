name: Deploy backend to EC2

on:
  push:
    branches: [dev-1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/dev-1'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Missing EC2_HOST}" "${EC2_USER:?Missing EC2_USER}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY}" "${EC2_KNOWN_HOSTS:?Missing EC2_KNOWN_HOSTS}"
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ec2_key ~/.ssh/known_hosts
      - name: Upload exact commit and deploy
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          KAFKA_BROKERS: ${{ secrets.KAFKA_BROKERS }}
          KAFKA_CLIENT_ID: ${{ secrets.KAFKA_CLIENT_ID }}
          KAFKA_GROUP_ID: ${{ secrets.KAFKA_GROUP_ID }}
          KAFKA_TOPIC: ${{ secrets.KAFKA_TOPIC }}
          KAFKA_TOPIC_PARTITIONS: ${{ secrets.KAFKA_TOPIC_PARTITIONS }}
          KAFKA_SASL_MECHANISM: ${{ secrets.KAFKA_SASL_MECHANISM }}
          KAFKA_SASL_USERNAME: ${{ secrets.KAFKA_SASL_USERNAME }}
          KAFKA_SASL_PASSWORD: ${{ secrets.KAFKA_SASL_PASSWORD }}
          KAFKA_CA_CERT_BASE64: ${{ secrets.KAFKA_CA_CERT_BASE64 }}
          KAFKA_CLIENT_CERT_BASE64: ${{ secrets.KAFKA_CLIENT_CERT_BASE64 }}
          KAFKA_CLIENT_KEY_BASE64: ${{ secrets.KAFKA_CLIENT_KEY_BASE64 }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
        run: |
          set -euo pipefail
          python3 deploy/render-env.py "$RUNNER_TEMP/backend.env"
          archive="release-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          git archive --format=tar.gz --output="$RUNNER_TEMP/$archive" HEAD
          scp -i ~/.ssh/ec2_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$RUNNER_TEMP/$archive" "$EC2_USER@$EC2_HOST:/opt/fundtech/uploads/$archive"
          # Send secrets over encrypted stdin, never as command arguments or logs.
          ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" "umask 077; cat > '/opt/fundtech/uploads/env-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'" < "$RUNNER_TEMP/backend.env"
          ssh -i ~/.ssh/ec2_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" "bash -s -- '$GITHUB_SHA' '$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT'" <<'REMOTE'
          set -euo pipefail
          revision="$1"
          run_id="$2"
          env_file="/opt/fundtech/uploads/env-$revision-$run_id"
          trap 'rm -f -- "$env_file"' EXIT
          release="/opt/fundtech/releases/$revision-$run_id"
          mkdir -p "$release"
          tar -xzf "/opt/fundtech/uploads/release-$revision-$run_id.tar.gz" -C "$release"
          bash "$release/deploy/ec2-deploy.sh" "$release" "$revision" "$env_file"
          REMOTE
      - name: Remove runner SSH key
        if: always()
        run: rm -f ~/.ssh/ec2_key "$RUNNER_TEMP/backend.env"
